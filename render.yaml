services:
  - type: web
    name: audio-monitoring-server
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CSV_PATH
        value: ../EGRA_EGMA_Combine_WIDE.csv
      - key: CSV_PATH_EGRA
        value: ../EGRA_EGMA_Combine_WIDE.csv
      - key: CSV_PATH_ASER
        value: ../ASER_ICT_Endline_FINAL_WIDE.csv
      - key: GOOGLE_SHEET_ID
        value: 1N1POd9dhcXy3f-u_UZggNsLzE3hlObK4Y7JzFJQANQI
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 13-sArEtLQ6yaGCv9q5D_i3igCLcXuxxQ
      - key: GOOGLE_DRIVE_FOLDER_ID_ASER
        value: 1nwBAKufRBoudR0Ta0LQVk6I5ydZAsgdf
      - key: GOOGLE_DRIVE_DATA_FILE_ID_EGRA
        value: 1MEkDufw_K4xue3oRHQmyFeSiKPYzeLe7
      - key: GOOGLE_DRIVE_DATA_FILE_ID_ASER
        value: 1vjEQTv6LaQGBTZ16M6Q32C7_5moFd2Tl
      - key: GOOGLE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: USERS
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
